<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=DynaPuff:wght@400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <title>Love Me</title>
</head>

<body>

    <!-- Mobile/No Mouse Support Message -->
    <div id="no_mouse_message" class="no-mouse-container">
        <div class="no-mouse-content">
            <h1 class="no-mouse-title">Open this on Desktop 💻</h1>
            <p class="no-mouse-subtitle">This experience is designed for mouse interactions. Please visit on a desktop or laptop to play! 🖱️</p>
        </div>
    </div>

    <!-- Main App Content (Hidden on Mobile) -->
    <div id="app_container" style="display: none;">
        <div id="body_content">

            <!-- Do you love me? - Question -->
            <div class="container">

                <h1>Do you love me?</h1>

                <div class="buttons-wrapper">
                    <div class="yes_div">
                        <button type="button" onclick="acceptYes()" class="btn btn_yes">Yes</button>
                    </div>

                    <div id="nodiv" class="no_div">
                        <button onmouseover="f()" class="btn btn_no">No</button>
                    </div>
                </div>

            </div>

            <!-- They said "Yes" -->
            <div id="overlay" class="overlay">
<div class="popup">
                    <h1 class="popup-title">I love you more</h1>
                    <p class="popup-subtitle">Okay… you're stuck with me now.</p>
                </div>

                    
                </div>
            </div>
        </div>
    </div>

    <script src="/script.js" type="text/javascript"></script>
</body>

</html>
